          },
      }
  /system/sending/resume:
    post:
      {
        tags: [Operations],
        operationId: resumeGlobalSending,
        summary: Release the global send kill switch after operator review,
        responses:
          {
            "200": { $ref: "#/components/responses/Success" },
            "403": { $ref: "#/components/responses/Error" },
          },
