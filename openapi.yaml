    get:
      {
        tags: [Analytics],
        operationId: getRecentCampaigns,
        summary: Return the ten most recently changed campaigns,
        responses: { "200": { $ref: "#/components/responses/Collection" } },
      }
  /audit-logs:
    get:
      {
        tags: [Operations],
        operationId: listAuditLogs,
        summary: Page administrative audit events,
        parameters:
          [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }],
        responses:
          {
            "200": { $ref: "#/components/responses/Collection" },
            "403": { $ref: "#/components/responses/Error" },
          },
      }
  /system/readiness:
    get:
      {
        tags: [Operations],
        operationId: getSystemReadiness,
