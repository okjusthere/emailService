openapi: 3.1.0
info:
  title: Homix Marketing Listing API
  version: 2.0.0
  description: Authenticated listing-marketing operations plus signed public delivery endpoints.
servers:
  - url: /api/v2
security:
  - cookieAuth: []
tags:
  - { name: Auth }
  - { name: Users }
  - { name: Agents }
  - { name: Contacts }
  - { name: Imports }
  - { name: Reference data }
  - { name: Suppressions }
  - { name: Listings }
  - { name: Audiences }
  - { name: Senders }
  - { name: Campaigns }
  - { name: Analytics }
  - { name: Operations }
  - { name: Public }
paths:
  /auth/me:
    get:
      {
        tags: [Auth],
        operationId: getCurrentUser,
        summary: Return the authenticated application user,
        responses:
          {
            "200": { $ref: "#/components/responses/Success" },
            "401": { $ref: "#/components/responses/Error" },
          },
      }
  /auth/dev-login:
    post:
      {
        tags: [Auth],
        operationId: localDevelopmentLogin,
        summary: Create a local-only development session,
        security: [],
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses:
          {
            "200": { $ref: "#/components/responses/Success" },
            "403": { $ref: "#/components/responses/Error" },
          },
      }
  /auth/logout:
    post:
      {
        tags: [Auth],
        operationId: logout,
        summary: Clear the local session or return the Easy Auth logout URL,
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /users:
    get:
      {
        tags: [Users],
        operationId: listUsers,
        summary: List provisioned users,
        responses:
          {
            "200": { $ref: "#/components/responses/Collection" },
            "403": { $ref: "#/components/responses/Error" },
          },
      }
    post:
      {
        tags: [Users],
        operationId: provisionUser,
        summary: Pre-provision a user and application role,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses:
          {
            "201": { $ref: "#/components/responses/Success" },
            "403": { $ref: "#/components/responses/Error" },
          },
      }
  /users/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      {
        tags: [Users],
        operationId: updateUser,
        summary: Change a user role or active state,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /agents:
    get:
      {
        tags: [Agents],
        operationId: listAgents,
        summary: List broker identities,
        responses: { "200": { $ref: "#/components/responses/Collection" } },
      }
    post:
      {
        tags: [Agents],
        operationId: createAgent,
        summary: Create a broker identity,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "201": { $ref: "#/components/responses/Success" } },
      }
  /agents/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        tags: [Agents],
        operationId: getAgent,
        summary: Get a broker identity,
        responses:
          {
            "200": { $ref: "#/components/responses/Success" },
            "404": { $ref: "#/components/responses/Error" },
          },
      }
    patch:
      {
        tags: [Agents],
        operationId: updateAgent,
        summary: Update a broker identity,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
    delete:
      {
        tags: [Agents],
        operationId: deactivateAgent,
        summary: Soft-deactivate a broker identity,
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /contacts:
    get:
      {
        tags: [Contacts],
        operationId: listContacts,
        summary: Search and page contacts with suppression state,
        parameters:
          [
            { $ref: "#/components/parameters/Page" },
            { $ref: "#/components/parameters/Limit" },
            { $ref: "#/components/parameters/Cursor" },
            { $ref: "#/components/parameters/Search" },
            { $ref: "#/components/parameters/ContactType" },
            { $ref: "#/components/parameters/ContactSourceType" },
            { $ref: "#/components/parameters/PermissionBasis" },
            { $ref: "#/components/parameters/ContactStatus" },
            { $ref: "#/components/parameters/MarketId" },
            { $ref: "#/components/parameters/PropertyInterestId" },
            { $ref: "#/components/parameters/TagId" },
            { $ref: "#/components/parameters/Suppressed" },
            { $ref: "#/components/parameters/ContactSort" },
            { $ref: "#/components/parameters/SortOrder" },
          ],
        responses: { "200": { $ref: "#/components/responses/Paginated" } },
      }
    post:
      {
        tags: [Contacts],
        operationId: createContact,
        summary: Create a contact with relationship metadata,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses:
          {
            "201": { $ref: "#/components/responses/Success" },
            "409": { $ref: "#/components/responses/Error" },
          },
      }
  /contacts/export:
    get:
      {
        tags: [Contacts],
        operationId: exportContacts,
        summary: Export formula-safe CSV,
        parameters:
          [
            { $ref: "#/components/parameters/Search" },
            { $ref: "#/components/parameters/ContactType" },
            { $ref: "#/components/parameters/ContactSourceType" },
            { $ref: "#/components/parameters/PermissionBasis" },
            { $ref: "#/components/parameters/ContactStatus" },
            { $ref: "#/components/parameters/MarketId" },
            { $ref: "#/components/parameters/PropertyInterestId" },
            { $ref: "#/components/parameters/TagId" },
            { $ref: "#/components/parameters/Suppressed" },
            { $ref: "#/components/parameters/ContactSort" },
            { $ref: "#/components/parameters/SortOrder" },
          ],
        responses: { "200": { $ref: "#/components/responses/Csv" } },
      }
  /contacts/bulk-update:
    post:
      {
        tags: [Contacts],
        operationId: bulkUpdateContacts,
        summary: Update up to one thousand contacts,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /contacts/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        tags: [Contacts],
        operationId: getContact,
        summary: Get contact history and suppression state,
        responses:
          {
            "200": { $ref: "#/components/responses/Success" },
            "404": { $ref: "#/components/responses/Error" },
          },
      }
    patch:
      {
        tags: [Contacts],
        operationId: updateContact,
        summary: Update contact profile and relationships,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
    delete:
      {
        tags: [Contacts],
        operationId: archiveContact,
        summary: Archive a contact without deleting audit history,
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /contacts/{id}/restore:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      {
        tags: [Contacts],
        operationId: restoreContact,
        summary: Restore an archived contact without clearing suppression,
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /contact-imports/upload:
    post:
      tags: [Imports]
      operationId: uploadContactImport
      summary: Upload a private CSV and source metadata
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              {
                type: object,
                required: [file, sourceType, permissionBasis],
                properties:
                  {
                    file: { type: string, format: binary },
                    sourceType: { type: string },
                    permissionBasis: { type: string },
                    sourceDetail: { type: string },
                  },
              }
      responses:
        {
          "201": { $ref: "#/components/responses/Success" },
          "413": { $ref: "#/components/responses/Error" },
          "415": { $ref: "#/components/responses/Error" },
        }
  /contact-imports/{id}/validate:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      {
        tags: [Imports],
        operationId: validateContactImport,
        summary: Validate an explicit CSV column mapping and produce a masked summary,
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            mapping:
                              {
                                type: object,
                                additionalProperties: { type: string },
                                description: Canonical field names mapped to uploaded CSV headers.,
                              },
                          },
                      },
                  },
              },
          },
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /contact-imports/{id}/apply:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      {
        tags: [Imports],
        operationId: applyContactImport,
        summary: Confirm reference creation and queue an idempotent validated import,
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [confirmCreateUnknownReferences],
                        properties:
                          { confirmCreateUnknownReferences: { type: boolean, default: false } },
                      },
                  },
              },
          },
        responses:
          {
            "202": { $ref: "#/components/responses/Success" },
            "409": { $ref: "#/components/responses/Error" },
          },
      }
  /contact-imports/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        tags: [Imports],
        operationId: getContactImport,
        summary: Return import status and aggregate counts,
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /contact-imports/{id}/errors.csv:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        tags: [Imports],
        operationId: downloadContactImportErrors,
        summary: Download a private formula-safe error report,
        responses:
          {
            "200": { $ref: "#/components/responses/Csv" },
            "404": { $ref: "#/components/responses/Error" },
          },
      }
  /tags:
    get:
      {
        tags: [Reference data],
        operationId: listTags,
        summary: List active tags,
        responses: { "200": { $ref: "#/components/responses/Collection" } },
      }
    post:
      {
        tags: [Reference data],
        operationId: createTag,
        summary: Create a tag,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "201": { $ref: "#/components/responses/Success" } },
      }
  /tags/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      {
        tags: [Reference data],
        operationId: updateTag,
        summary: Update a tag,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
    delete:
      {
        tags: [Reference data],
        operationId: deactivateTag,
        summary: Deactivate a tag,
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /markets:
    get:
      {
        tags: [Reference data],
        operationId: listMarkets,
        summary: List active market hierarchy,
        responses: { "200": { $ref: "#/components/responses/Collection" } },
      }
    post:
      {
        tags: [Reference data],
        operationId: createMarket,
        summary: Create a market,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "201": { $ref: "#/components/responses/Success" } },
      }
  /markets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      {
        tags: [Reference data],
        operationId: updateMarket,
        summary: Update a market,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
    delete:
      {
        tags: [Reference data],
        operationId: deactivateMarket,
        summary: Deactivate a market,
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /property-interests:
    get:
      {
        tags: [Reference data],
        operationId: listPropertyInterests,
        summary: List active property interests,
        responses: { "200": { $ref: "#/components/responses/Collection" } },
      }
    post:
      {
        tags: [Reference data],
        operationId: createPropertyInterest,
        summary: Create a property interest,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "201": { $ref: "#/components/responses/Success" } },
      }
  /property-interests/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      {
        tags: [Reference data],
        operationId: updatePropertyInterest,
        summary: Update a property interest,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
    delete:
      {
        tags: [Reference data],
        operationId: deactivatePropertyInterest,
        summary: Deactivate a property interest,
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /suppressions:
    get:
      {
        tags: [Suppressions],
        operationId: listSuppressions,
        summary: List global suppressions,
        parameters:
          [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }],
        responses: { "200": { $ref: "#/components/responses/Paginated" } },
      }
  /suppressions/manual:
    post:
      {
        tags: [Suppressions],
        operationId: createManualSuppression,
        summary: Add or strengthen a global suppression,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "201": { $ref: "#/components/responses/Success" } },
      }
  /suppressions/{id}/release:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      {
        tags: [Suppressions],
        operationId: releaseSuppression,
        summary: Admin-only release with a written reason,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses:
          {
            "200": { $ref: "#/components/responses/Success" },
            "403": { $ref: "#/components/responses/Error" },
          },
      }
  /listings:
    get:
      {
        tags: [Listings],
        operationId: listListings,
        summary: Search and page listings,
        parameters:
          [
            { $ref: "#/components/parameters/Page" },
            { $ref: "#/components/parameters/Limit" },
            { $ref: "#/components/parameters/Cursor" },
            { $ref: "#/components/parameters/Search" },
            { $ref: "#/components/parameters/ListingStatus" },
            { $ref: "#/components/parameters/PropertyType" },
            { $ref: "#/components/parameters/TransactionType" },
            { $ref: "#/components/parameters/AgentId" },
          ],
        responses: { "200": { $ref: "#/components/responses/Paginated" } },
      }
    post:
      {
        tags: [Listings],
        operationId: createListing,
        summary: Create a listing draft,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "201": { $ref: "#/components/responses/Success" } },
      }
  /listings/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        tags: [Listings],
        operationId: getListing,
        summary: Return property facts assets and campaigns,
        responses:
          {
            "200": { $ref: "#/components/responses/Success" },
            "404": { $ref: "#/components/responses/Error" },
          },
      }
    patch:
      {
        tags: [Listings],
        operationId: updateListing,
        summary: Update a listing with optimistic versioning,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses:
          {
            "200": { $ref: "#/components/responses/Success" },
            "409": { $ref: "#/components/responses/Error" },
          },
      }
  /listings/{id}/duplicate:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      {
        tags: [Listings],
        operationId: duplicateListing,
        summary: Duplicate listing content into a draft,
        responses: { "201": { $ref: "#/components/responses/Success" } },
      }
  /listings/{id}/archive:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      {
        tags: [Listings],
        operationId: archiveListing,
        summary: Archive a listing,
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /listings/{id}/assets:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Listings]
      operationId: uploadListingAsset
      summary: Validate transform and store a listing asset
      requestBody:
        {
          required: true,
          content:
            {
              multipart/form-data:
                {
                  schema:
                    {
                      type: object,
                      required: [file, kind],
                      properties:
                        {
                          file: { type: string, format: binary },
                          kind: { type: string },
                          altText: { type: string },
                        },
                    },
                },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Success" },
          "413": { $ref: "#/components/responses/Error" },
          "415": { $ref: "#/components/responses/Error" },
        }
  /listings/{id}/assets/reorder:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      {
        tags: [Listings],
        operationId: reorderListingAssets,
        summary: Reorder or reclassify assets,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /listings/{id}/assets/{assetId}:
    parameters:
      [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/AssetId" }]
    delete:
      {
        tags: [Listings],
        operationId: deleteListingAsset,
        summary: Soft-delete an asset reference,
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /audiences/estimate:
    post:
      {
        tags: [Audiences],
        operationId: estimateAudience,
        summary: Estimate matched eligible suppressed and unknown contacts,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /audiences:
    get:
      {
        tags: [Audiences],
        operationId: listAudiences,
        summary: List saved audience definitions,
        responses: { "200": { $ref: "#/components/responses/Collection" } },
      }
    post:
      {
        tags: [Audiences],
        operationId: createAudience,
        summary: Save a validated audience DSL document,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "201": { $ref: "#/components/responses/Success" } },
      }
  /audiences/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        tags: [Audiences],
        operationId: getAudience,
        summary: Get a saved audience,
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
    patch:
      {
        tags: [Audiences],
        operationId: updateAudience,
        summary: Update a saved audience,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
    delete:
      {
        tags: [Audiences],
        operationId: deleteAudience,
        summary: Delete an unused saved audience,
        responses: { "204": { description: Deleted } },
      }
  /audiences/{id}/duplicate:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      {
        tags: [Audiences],
        operationId: duplicateAudience,
        summary: Duplicate a saved audience,
        responses: { "201": { $ref: "#/components/responses/Success" } },
      }
  /sender-profiles:
    get:
      {
        tags: [Senders],
        operationId: listSenderProfiles,
        summary: List sender policies and verification state,
        responses: { "200": { $ref: "#/components/responses/Collection" } },
      }
    post:
      {
        tags: [Senders],
        operationId: createSenderProfile,
        summary: Create an unverified sender policy,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "201": { $ref: "#/components/responses/Success" } },
      }
  /sender-profiles/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      {
        tags: [Senders],
        operationId: updateSenderProfile,
        summary: Update sender windows quota or warm-up,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /sender-profiles/{id}/verify:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      {
        tags: [Senders],
        operationId: verifySenderProfile,
        summary: Record an administrator domain-verification confirmation,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /sender-profiles/{id}/suspend:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      {
        tags: [Senders],
        operationId: suspendSenderProfile,
        summary: Suspend a sender from future campaigns,
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /sender-profiles/{id}/quota:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        tags: [Senders],
        operationId: getSenderQuota,
        summary: Return recent reserved accepted and released quota,
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /campaigns:
    get:
      {
        tags: [Campaigns],
        operationId: listCampaigns,
        summary: Search and page campaigns,
        parameters:
          [
            { $ref: "#/components/parameters/Page" },
            { $ref: "#/components/parameters/Limit" },
            { $ref: "#/components/parameters/Cursor" },
            { $ref: "#/components/parameters/Search" },
          ],
        responses: { "200": { $ref: "#/components/responses/Paginated" } },
      }
    post:
      {
        tags: [Campaigns],
        operationId: createCampaign,
        summary: Create a mutable campaign draft,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "201": { $ref: "#/components/responses/Success" } },
      }
  /campaigns/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        tags: [Campaigns],
        operationId: getCampaign,
        summary: Get campaign configuration,
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
    patch:
      {
        tags: [Campaigns],
        operationId: updateCampaign,
        summary: Update an editable campaign using If-Match version,
        parameters:
          [{ name: If-Match, in: header, required: true, schema: { type: integer, minimum: 1 } }],
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses:
          {
            "200": { $ref: "#/components/responses/Success" },
            "409": { $ref: "#/components/responses/Error" },
          },
      }
  /campaigns/{id}/duplicate:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      {
        tags: [Campaigns],
        operationId: duplicateCampaign,
        summary: Duplicate a campaign into a new draft,
        responses: { "201": { $ref: "#/components/responses/Success" } },
      }
  /campaigns/{id}/preview:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      {
        tags: [Campaigns],
        operationId: previewCampaign,
        summary: Render HTML and text without sending,
        requestBody: { $ref: "#/components/requestBodies/JsonBody" },
        responses: { "200": { $ref: "#/components/responses/Success" } },
      }
  /campaigns/{id}/test-send:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      {
