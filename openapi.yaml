  /public/webhooks/resend:
    post:
      {
        tags: [Public],
        operationId: ingestResendWebhook,
        summary: Verify and retain the untouched signed Resend webhook,
        security: [],
        servers: [{ url: /api }],
        requestBody:
          {
            required: true,
            content: { application/json: { schema: { type: object, additionalProperties: true } } },
          },
        responses:
          {
            "200": { $ref: "#/components/responses/Success" },
            "401": { $ref: "#/components/responses/Error" },
          },
      }
  /public/unsubscribe/confirm:
    post:
      {
        tags: [Public],
        operationId: confirmVisibleUnsubscribe,
        summary: Confirm a visible signed unsubscribe link,
        security: [],
        servers: [{ url: /api }],
        requestBody: { $ref: "#/components/requestBodies/TokenBody" },
        responses:
          {
            "200":
              {
                description: Human-readable confirmation,
                content: { text/html: { schema: { type: string } } },
              },
            "400": { $ref: "#/components/responses/Error" },
          },
      }
  /public/unsubscribe/one-click:
    post:
      {
        tags: [Public],
        operationId: oneClickUnsubscribe,
        summary: RFC 8058 one-click unsubscribe,
        security: [],
        servers: [{ url: /api }],
        parameters: [{ name: token, in: query, required: false, schema: { type: string } }],
        responses:
          { "204": { description: Suppressed }, "400": { $ref: "#/components/responses/Error" } },
      }
components:
  securitySchemes:
    cookieAuth:
      {
        type: apiKey,
        in: cookie,
        name: homix_session,
        description: Local development cookie; Azure production uses Easy Auth before this API.,
      }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    AssetId: { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    RecipientId:
      { name: recipientId, in: path, required: true, schema: { type: string, format: uuid } }
    Page:
      { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    Limit:
      {
        name: limit,
        in: query,
        required: false,
        schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
      }
    Cursor:
      {
        name: cursor,
        in: query,
        required: false,
        schema: { type: string, format: uuid },
        description: Opaque ID returned as nextCursor by the preceding page.,
      }
    Search: { name: search, in: query, required: false, schema: { type: string, maxLength: 200 } }
    ContactType:
      {
        name: contactType,
        in: query,
        schema:
          {
            type: string,
            enum:
              [
                BUYER,
                SELLER,
                INVESTOR,
                BROKER,
                TENANT,
                LANDLORD,
                DEVELOPER,
                LENDER,
                ATTORNEY,
                VENDOR,
                PAST_CLIENT,
                OTHER,
              ],
          },
      }
    ContactSourceType:
      {
        name: sourceType,
        in: query,
        schema:
          {
            type: string,
            enum:
              [
                PAST_CLIENT,
                OPEN_HOUSE,
                WEBSITE,
                BROKER_RELATIONSHIP,
                EVENT,
                CRM_IMPORT,
                MANUAL,
                REFERRAL,
                LEGACY_EMAIL_SERVICE,
                OTHER,
              ],
          },
      }
    PermissionBasis:
      {
        name: permissionBasis,
        in: query,
        schema: { type: string, enum: [OPT_IN, EXISTING_RELATIONSHIP, BUSINESS_CONTACT, UNKNOWN] },
      }
    ContactStatus:
      { name: status, in: query, schema: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] } }
    MarketId: { name: marketId, in: query, schema: { type: string, format: uuid } }
    PropertyInterestId:
      { name: propertyInterestId, in: query, schema: { type: string, format: uuid } }
    TagId: { name: tagId, in: query, schema: { type: string, format: uuid } }
    Suppressed: { name: suppressed, in: query, schema: { type: string, enum: ["true", "false"] } }
    ContactSort:
      {
        name: sort,
        in: query,
        schema: { type: string, enum: [createdAt, lastEngagedAt, lastSentAt], default: createdAt },
      }
    SortOrder:
      { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
    ListingStatus:
      {
        name: status,
        in: query,
        schema:
          {
            type: string,
            enum: [DRAFT, ACTIVE, UNDER_CONTRACT, SOLD, LEASED, WITHDRAWN, ARCHIVED],
          },
      }
    PropertyType:
      {
        name: propertyType,
        in: query,
        schema:
          {
            type: string,
            enum:
              [
                OFFICE,
                RETAIL,
                INDUSTRIAL,
                MULTIFAMILY,
                LAND,
                MIXED_USE,
                HOSPITALITY,
                SPECIAL_PURPOSE,
                BUSINESS,
                RESIDENTIAL,
                OTHER,
              ],
          },
      }
    TransactionType:
      {
        name: transactionType,
        in: query,
        schema: { type: string, enum: [FOR_SALE, FOR_LEASE, SALE_OR_LEASE] },
      }
    AgentId: { name: agentId, in: query, schema: { type: string, format: uuid } }
    RecipientSendState:
      {
        name: sendState,
        in: query,
        schema:
          {
            type: string,
            enum:
              [
                PENDING,
                RESERVED,
                SENDING,
                ACCEPTED,
                TEMPORARY_FAILED,
                PERMANENT_FAILED,
                SUPPRESSED,
                CANCELLED,
                MANUAL_REVIEW,
              ],
          },
      }
    RecipientDeliveryState:
      {
        name: deliveryState,
        in: query,
        schema:
          { type: string, enum: [UNKNOWN, DELIVERED, BOUNCED, COMPLAINED, PROVIDER_SUPPRESSED] },
      }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: false,
        schema: { type: string, maxLength: 80 },
        description: Stable client action key used to deduplicate schedule or send-now.,
      }
  requestBodies:
    JsonBody:
      {
        required: true,
        content: { application/json: { schema: { type: object, additionalProperties: true } } },
      }
    TokenBody:
      {
        required: true,
        content:
          {
            application/x-www-form-urlencoded:
              {
                schema:
                  {
                    type: object,
                    required: [token],
                    properties: { token: { type: string, minLength: 20, maxLength: 1000 } },
                  },
              },
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [token],
                    properties: { token: { type: string, minLength: 20, maxLength: 1000 } },
                  },
              },
          },
      }
  schemas:
    AnyObject: { type: object, additionalProperties: true }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            {
              code: { type: string },
              message: { type: string },
              details: { type: object, additionalProperties: true },
              requestId: { type: string },
            }
  responses:
    Success:
      {
        description: Successful JSON response,
        content: { application/json: { schema: { $ref: "#/components/schemas/AnyObject" } } },
      }
    Collection:
      {
        description: JSON collection,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [items],
                    properties:
                      { items: { type: array, items: { $ref: "#/components/schemas/AnyObject" } } },
                  },
              },
          },
      }
    Paginated:
      {
        description: Paginated JSON collection,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [items, total, page, limit],
                    properties:
                      {
                        items: { type: array, items: { $ref: "#/components/schemas/AnyObject" } },
                        total: { type: integer },
                        page: { type: integer },
                        limit: { type: integer },
                        nextCursor: { type: [string, "null"], format: uuid },
                      },
                  },
              },
          },
      }
    Csv:
      {
        description: Formula-safe CSV attachment,
        content: { text/csv: { schema: { type: string } } },
      }
    Error:
      {
        description: Structured API error,
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
