name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://homix:homix@localhost:5434/homix_marketing?schema=public
      DIRECT_DATABASE_URL: postgresql://homix:homix@localhost:5434/homix_marketing?schema=public
      AUTH_MODE: local
      LOCAL_ADMIN_EMAIL: admin@homixny.com
      SESSION_SECRET: ci-session-secret-at-least-sixteen-bytes
      EMAIL_PROVIDER: fake
      EMAIL_DELIVERY_MODE: disabled
      EMAIL_TEST_ALLOWLIST: admin@homixny.com
      STORAGE_PROVIDER: local
      LOCAL_ASSET_DIR: ./data/test-assets
      PUBLIC_ASSET_BASE_URL: http://localhost:3000/public/assets
      COMPANY_POSTAL_ADDRESS: 123 Main Street, Huntington, NY 11743
      UNSUBSCRIBE_SIGNING_SECRET: ci-unsubscribe-secret-at-least-thirty-two-bytes
      ONEKEY_PROVIDER: fake
      AI_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run source:archive:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:coverage
      - run: docker compose up -d --wait postgres
      - run: npm run prisma:migrate:deploy
      - run: npm run db:seed
      - run: npm run test:api
      - run: npm run test:integration
      - run: npm run build
      - run: docker build -t homix-marketing:${{ github.sha }} .
      - run: az bicep build --file infra/bootstrap.bicep --stdout > /dev/null
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: npm run openapi:lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
