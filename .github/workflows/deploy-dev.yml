name: Deploy development

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: Immutable image tag (defaults to commit SHA)
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: homix-marketing-development
  cancel-in-progress: false

jobs:
  deploy:
    environment: development
    runs-on: ubuntu-latest
    env:
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      HOMIX_BASE_URL: ${{ vars.HOMIX_BASE_URL }}
      HOMIX_CUSTOM_DOMAIN: ${{ vars.HOMIX_CUSTOM_DOMAIN }}
      AZURE_MANAGED_CERTIFICATE_NAME: ${{ vars.AZURE_MANAGED_CERTIFICATE_NAME }}
      BOOTSTRAP_ADMIN_EMAILS: ${{ vars.BOOTSTRAP_ADMIN_EMAILS }}
      COMPANY_POSTAL_ADDRESS: ${{ vars.COMPANY_POSTAL_ADDRESS }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      USE_RESEND_SECRETS: ${{ vars.USE_RESEND_SECRETS }}
      USE_PREVIOUS_RESEND_WEBHOOK_SECRET: ${{ vars.USE_PREVIOUS_RESEND_WEBHOOK_SECRET }}
      RESEND_WEBHOOK_PREVIOUS_SECRET_EXPIRES_AT: ${{ vars.RESEND_WEBHOOK_PREVIOUS_SECRET_EXPIRES_AT }}
      USE_PREVIOUS_UNSUBSCRIBE_SIGNING_SECRET: ${{ vars.USE_PREVIOUS_UNSUBSCRIBE_SIGNING_SECRET || 'false' }}
      UNSUBSCRIBE_PREVIOUS_SIGNING_SECRET_EXPIRES_AT: ${{ vars.UNSUBSCRIBE_PREVIOUS_SIGNING_SECRET_EXPIRES_AT }}
      ONEKEY_PROVIDER: ${{ vars.ONEKEY_PROVIDER || 'disabled' }}
      BBO_LISTING_API_BASE_URL: ${{ vars.BBO_LISTING_API_BASE_URL }}
      ONEKEY_MEDIA_ALLOWED_ORIGINS: ${{ vars.ONEKEY_MEDIA_ALLOWED_ORIGINS }}
      USE_BBO_MARKETING_API_KEY: ${{ vars.USE_BBO_MARKETING_API_KEY || 'false' }}
      USE_MLS_GRID_ACCESS_TOKEN: ${{ vars.USE_MLS_GRID_ACCESS_TOKEN || 'false' }}
      ONEKEY_SYNC_ENABLED: ${{ vars.ONEKEY_SYNC_ENABLED || 'false' }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'disabled' }}
      USE_OPENAI_API_KEY: ${{ vars.USE_OPENAI_API_KEY || 'false' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
      USE_ENTRA_CLIENT_SECRET: ${{ vars.USE_ENTRA_CLIENT_SECRET }}
      EMAIL_DELIVERY_MODE: disabled
      DEPLOYMENT_TIER: ${{ vars.DEPLOYMENT_TIER || 'starter' }}
      ENABLE_ZONE_REDUNDANT_HA: ${{ vars.ENABLE_ZONE_REDUNDANT_HA || 'false' }}
      POSTGRES_BACKUP_RETENTION_DAYS: ${{ vars.POSTGRES_BACKUP_RETENTION_DAYS || '7' }}
      ENABLE_GEO_REDUNDANT_BACKUP: ${{ vars.ENABLE_GEO_REDUNDANT_BACKUP || 'false' }}
      STORAGE_SKU_NAME: ${{ vars.STORAGE_SKU_NAME || 'Standard_LRS' }}
      IMAGE_TAG_INPUT: ${{ inputs.imageTag }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: image
        shell: bash
        run: |
          tag="$IMAGE_TAG_INPUT"
          tag="${tag:-${GITHUB_SHA}}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag" >&2
            exit 1
          fi
          login_server="$(az acr show -n "$AZURE_ACR_NAME" --query loginServer -o tsv)"
          az acr build -r "$AZURE_ACR_NAME" -t "homix-marketing:${tag}" -t "homix-marketing:2.0.0-${GITHUB_RUN_NUMBER}" .
          echo "uri=${login_server}/homix-marketing:${tag}" >> "${GITHUB_OUTPUT}"
      - run: chmod +x scripts/deploy-release.sh
      - env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: scripts/deploy-release.sh "$AZURE_RESOURCE_GROUP" dev "$IMAGE_URI"
      - uses: actions/upload-artifact@v4
        with: { name: deployment-development-summary, path: deployment-summary.md }
